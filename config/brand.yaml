# YourCFO 品牌口径
# 凡是标 TODO 的，是我读不到或你没告诉我、需要你填的，不要让我猜。

version: 1
updated: 2026-09-23

account:
  name: YourCFO
  type: 个人号
  positioning: 跨境企业主的合规避坑指南
  themes:
    - 境外企业架构
    - 境外账户监管
  audience: 有境外架构 / 境外账户的企业主与跨境高净值人士

signature:
  line1: "写跨境财税合规的日常判断，只讲规则，不给方案。"
  line2: "本文基于公开规则与公开信息整理，不构成专业意见。"

cta:
  keywords:                         # 来自《日更账号完整规划 V2.0》的 CTA 体系
    - 对账
    - 工具包
    - 架构
  xingqiu: ""                     # 降权修复期：置空。修复期内一切站外指向为 ERROR。
                                  # 解除条件：篇均阅读回到 150+，或「看一看/推荐」来源占比 > 20%，
                                  # 且期间无新增违规记录。解除后分三步恢复，见下。

recovery_mode:                      # 2026-08 恶意引流判定后的修复期规则
  active: true
  since: 2026-09-23
  incident: incidents/2026-08-恶意引流判定.md
  finding: |
    8 月 20 篇篇篇带二维码，只判 3 篇 —— 二维码是底火不是扳机。
    扳机是「规避路径型内容 + 站外付费社群指向」的组合：
    被判的 3 篇（0820/0821/0824）回答的都不是「规则是什么」，
    而是「我会不会被查到 / 这条路还能不能走」。
    且三篇阅读量 1000+/500+/200+，远高于当月均值 —— 高曝光触发了内容安全复审。
  rules:
    - 修复期内正文零站外指向：星球、二维码、微信、联系方式、站外链接、诱导分享，一律 ERROR
    - 替代方案：文末用具体的开放式提问收留言，把高意向读者沉在留言区
    - 同一主线内容不连续两天发布
    - 单篇阅读超过篇均 3 倍时，事后单独复检合规性
  restore_steps:                    # 解除后分三步，不可跳步
    - 第一步：只在正文自然提及内容本身（「这个问题我在星球里展开写过」），不提入口
    - 第二步：留言区精选回复中提及，仍不放码不放链接
    - 第三步：二维码只回自定义菜单（被动入口）；正文永久不放码

permanent_redlines:                 # 本次事故确立，不随修复期解除而失效
  - 不写「会不会被查到」「这条路还能不能走通」「还能不能复制」型的处境判定
  - 处境判定类文章永远不配任何星球指向；只有纯规则解读、纯案例复盘类才允许带
  - 正文永久不放二维码

redlines:                           # 来自《YourCFO 账号体系打法 V3.0》第七部分
  - 所有具体数字、案例、政策 citation 必须独立核实，无法核实一律排除或替换
  - 案例分析只能基于检索到的案件事实，公示未披露的细节不得自行推断成文
  - 条文适用必须与案件事实精确对应，写前先确认持股结构
  - 不模仿对标账号的明星补税标题
  - 不出现「换个主体」「拆成几个公司」「分散收入」等表述
  - 正文不加粗、少用引号、无 AI 味反问和套话过渡
  - 不做「喂料 / 投毒」式的 GEO：只做真实专业内容的结构化表达

structure:
  forbid_serial_numbering: true      # 禁止「第 X 关」「上/下篇」这类追更编号
  layers: [入口层A, 转化层B, 沉淀层C]
  weekly_ratio: [2, 2, 1]
